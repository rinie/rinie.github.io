<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 760" role="img">
  <title>Gutenberg vs Semantic iceberg diagram</title>
  <desc>Two icebergs side by side. Left: Unix/Node.js stack with a clean Gutenberg/Semantic boundary at fread/libc — the top 20% is portable and can move to a new cloud zone. Right: Java/.NET stack where semantic noise permeates every layer with no clean boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#185FA5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#042C53" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ice-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6F1FB"/>
      <stop offset="100%" stop-color="#B5D4F4"/>
    </linearGradient>
    <linearGradient id="ice-r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAECE7"/>
      <stop offset="100%" stop-color="#F5C4B3"/>
    </linearGradient>
    <clipPath id="clip-l">
      <polygon points="90,120 250,120 270,680 70,680"/>
    </clipPath>
    <clipPath id="clip-r">
      <polygon points="420,120 590,120 610,680 400,680"/>
    </clipPath>
  </defs>

  <!-- Background white -->
  <rect width="680" height="760" fill="#ffffff"/>

  <!-- Ocean -->
  <rect x="0" y="380" width="680" height="380" fill="url(#sea)"/>
  <line x1="0" y1="380" x2="680" y2="380" stroke="#185FA5" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="12" x="8" y="374" fill="#185FA5" opacity="0.7">waterline</text>

  <!-- ===== LEFT ICEBERG: Unix / Node.js ===== -->
  <polygon points="90,120 250,120 270,680 70,680" fill="url(#ice-l)" stroke="#185FA5" stroke-width="0.5" opacity="0.9"/>
  <!-- Semantic cap highlight -->
  <polygon points="94,124 246,124 252,320 88,320" fill="#185FA5" opacity="0.12" clip-path="url(#clip-l)"/>
  <!-- fread boundary line -->
  <line x1="82" y1="320" x2="258" y2="320" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text font-family="system-ui,sans-serif" font-size="11" x="84" y="314" fill="#185FA5">fread / libc boundary</text>

  <!-- Semantic layer labels -->
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="170" y="152" text-anchor="middle" fill="#0C447C">Your code</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="170" y="170" text-anchor="middle" fill="#185FA5">business logic</text>
  <line x1="170" y1="182" x2="170" y2="196" stroke="#378ADD" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="170" y="212" text-anchor="middle" fill="#0C447C">Framework / MVC</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="170" y="228" text-anchor="middle" fill="#185FA5">semantic layer only</text>
  <line x1="170" y1="240" x2="170" y2="254" stroke="#378ADD" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="170" y="270" text-anchor="middle" fill="#0C447C">Node.js / ES6+</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="170" y="286" text-anchor="middle" fill="#185FA5">evergreen, semver</text>

  <!-- Gutenberg layer labels -->
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="170" y="348" text-anchor="middle" fill="#042C53">fread / libc</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="170" y="364" text-anchor="middle" fill="#185FA5">page-sized buffering</text>
  <line x1="170" y1="376" x2="170" y2="390" stroke="#378ADD" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="170" y="410" text-anchor="middle" fill="#042C53">OS / kernel</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="170" y="426" text-anchor="middle" fill="#185FA5">syscall, page cache</text>
  <line x1="170" y1="438" x2="170" y2="452" stroke="#378ADD" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="170" y="472" text-anchor="middle" fill="#042C53">TCP / IP</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="170" y="488" text-anchor="middle" fill="#185FA5">bytestream, MTU 1500</text>
  <line x1="170" y1="500" x2="170" y2="514" stroke="#378ADD" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="170" y="534" text-anchor="middle" fill="#042C53">Disk / RAM</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="170" y="550" text-anchor="middle" fill="#185FA5">4096-byte pages</text>
  <line x1="170" y1="562" x2="170" y2="576" stroke="#378ADD" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="170" y="596" text-anchor="middle" fill="#042C53">Hardware / CPU</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="170" y="612" text-anchor="middle" fill="#185FA5">Moore's Law</text>

  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="170" y="106" text-anchor="middle" fill="#0C447C">Unix / Node.js</text>

  <!-- Portable top annotation -->
  <rect x="258" y="130" width="86" height="30" rx="4" fill="#185FA5" opacity="0.12" stroke="#185FA5" stroke-width="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="12" x="301" y="142" text-anchor="middle" fill="#0C447C">portable</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="301" y="155" text-anchor="middle" fill="#0C447C">top ~20%</text>
  <line x1="258" y1="145" x2="248" y2="220" stroke="#185FA5" stroke-width="0.5" opacity="0.6" marker-end="url(#arrow)"/>

  <!-- Migration arc -->
  <path d="M 258 230 Q 340 190 422 230" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text font-family="system-ui,sans-serif" font-size="12" x="340" y="205" text-anchor="middle" fill="#185FA5">move to new</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="340" y="218" text-anchor="middle" fill="#185FA5">cloud zone</text>

  <!-- ===== RIGHT ICEBERG: Java / .NET ===== -->
  <polygon points="420,120 590,120 610,680 400,680" fill="url(#ice-r)" stroke="#D85A30" stroke-width="0.5" opacity="0.9"/>
  <!-- Noise overlay -->
  <polygon points="424,124 586,124 592,680 404,680" fill="#D85A30" opacity="0.07" clip-path="url(#clip-r)"/>
  <!-- Noise bands -->
  <rect x="424" y="200" width="162" height="6" rx="2" fill="#D85A30" opacity="0.15"/>
  <rect x="424" y="290" width="162" height="6" rx="2" fill="#D85A30" opacity="0.15"/>
  <rect x="424" y="390" width="162" height="6" rx="2" fill="#D85A30" opacity="0.12"/>
  <rect x="424" y="490" width="162" height="6" rx="2" fill="#D85A30" opacity="0.10"/>
  <rect x="424" y="580" width="162" height="6" rx="2" fill="#D85A30" opacity="0.08"/>

  <!-- No clean boundary indicator -->
  <line x1="412" y1="370" x2="598" y2="370" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="11" x="414" y="364" fill="#D85A30" opacity="0.7">no clean boundary</text>

  <!-- Java/.NET labels -->
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="505" y="152" text-anchor="middle" fill="#712B13">Your code</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="505" y="170" text-anchor="middle" fill="#993C1D">tightly coupled</text>
  <line x1="505" y1="182" x2="505" y2="196" stroke="#D85A30" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="505" y="216" text-anchor="middle" fill="#712B13">Framework</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="505" y="232" text-anchor="middle" fill="#993C1D">Spring / ASP.NET</text>
  <line x1="505" y1="244" x2="505" y2="258" stroke="#D85A30" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="505" y="278" text-anchor="middle" fill="#712B13">JVM / CLR</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="505" y="294" text-anchor="middle" fill="#993C1D">version-baked runtime</text>
  <line x1="505" y1="306" x2="505" y2="320" stroke="#D85A30" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="505" y="340" text-anchor="middle" fill="#712B13">Bytecode / IL</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="505" y="356" text-anchor="middle" fill="#993C1D">semantic metadata</text>
  <line x1="505" y1="380" x2="505" y2="394" stroke="#D85A30" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="505" y="414" text-anchor="middle" fill="#712B13">OS / kernel</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="505" y="430" text-anchor="middle" fill="#993C1D">leaks upward</text>
  <line x1="505" y1="442" x2="505" y2="456" stroke="#D85A30" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="505" y="476" text-anchor="middle" fill="#712B13">TCP / IP</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="505" y="492" text-anchor="middle" fill="#993C1D">bytestream</text>
  <line x1="505" y1="504" x2="505" y2="518" stroke="#D85A30" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="505" y="538" text-anchor="middle" fill="#712B13">Disk / RAM</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="505" y="554" text-anchor="middle" fill="#993C1D">4096-byte pages</text>
  <line x1="505" y1="566" x2="505" y2="580" stroke="#D85A30" stroke-width="0.5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="505" y="600" text-anchor="middle" fill="#712B13">Hardware / CPU</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="505" y="616" text-anchor="middle" fill="#993C1D">upgrade breaks stack</text>

  <text font-family="system-ui,sans-serif" font-size="14" font-weight="500" x="505" y="106" text-anchor="middle" fill="#712B13">Java / .NET</text>

  <!-- Locked annotation -->
  <rect x="600" y="130" width="68" height="30" rx="4" fill="#D85A30" opacity="0.12" stroke="#D85A30" stroke-width="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="12" x="634" y="142" text-anchor="middle" fill="#712B13">whole stack</text>
  <text font-family="system-ui,sans-serif" font-size="12" x="634" y="155" text-anchor="middle" fill="#712B13">must move</text>
  <line x1="600" y1="145" x2="590" y2="300" stroke="#D85A30" stroke-width="0.5" opacity="0.6" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="704" width="600" height="44" rx="6" fill="none" stroke="#888780" stroke-width="0.5"/>
  <rect x="52" y="716" width="12" height="12" rx="2" fill="#185FA5" opacity="0.5"/>
  <text font-family="system-ui,sans-serif" font-size="12" x="70" y="725" fill="#444441">Gutenberg layer — physical, bytes, blocks</text>
  <rect x="52" y="730" width="12" height="12" rx="2" fill="#185FA5" opacity="0.15"/>
  <text font-family="system-ui,sans-serif" font-size="12" x="70" y="739" fill="#444441">Semantic layer — logic, meaning, portable</text>
  <rect x="320" y="716" width="12" height="12" rx="2" fill="#D85A30" opacity="0.4"/>
  <text font-family="system-ui,sans-serif" font-size="12" x="338" y="725" fill="#444441">Semantic noise bleeding through layers</text>
  <line x1="320" y1="737" x2="332" y2="737" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text font-family="system-ui,sans-serif" font-size="12" x="338" y="739" fill="#444441">Clean Gutenberg / Semantic boundary</text>
</svg>
